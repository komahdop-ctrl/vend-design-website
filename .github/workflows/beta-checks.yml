name: Beta checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 scripts/build_public.py --mode beta --output dist/vend-design-beta --zip
      - uses: actions/upload-artifact@v4
        with:
          name: vend-design-beta-package
          path: dist/vend-design-beta.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-screenshots
          path: test-results/
